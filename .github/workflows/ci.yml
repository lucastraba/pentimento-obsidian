name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: Build, then walk the built plugin through a draft cycle
        run: npm test
